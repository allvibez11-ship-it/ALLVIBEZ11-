<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 84" width="420" height="84">
  <defs>
    <linearGradient id="vibeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="45%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(6, 10)">
    <!-- Rounded emblem -->
    <rect width="64" height="64" rx="16" fill="url(#badgeGrad)" stroke="#334155" stroke-width="2"/>
    
    <!-- Soundwave & movie reel bars -->
    <rect x="10" y="26" width="3.5" height="12" rx="1.75" fill="#F59E0B" />
    <rect x="16" y="18" width="3.5" height="28" rx="1.75" fill="#EF4444" />
    <rect x="22" y="12" width="3.5" height="40" rx="1.75" fill="url(#vibeGrad)" />
    
    <!-- Monogram V -->
    <path d="M 29 18 L 37 46 L 43 46 L 51 18 L 45 18 L 40 37 L 35 18 Z" fill="#FFFFFF"/>
    
    <!-- 11 Bars -->
    <rect x="52" y="20" width="3.5" height="24" rx="1.75" fill="url(#vibeGrad)"/>
    <rect x="57" y="20" width="3.5" height="24" rx="1.75" fill="url(#vibeGrad)"/>
  </g>

  <!-- Wordmark Text -->
  <g transform="translate(86, 48)">
    <!-- ALL in bold white -->
    <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="1">ALL</text>
    <!-- VIBEZ in vibrant gradient -->
    <text x="70" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="url(#vibeGrad)" letter-spacing="1.5">VIBEZ</text>
    <!-- 11 in highlighted electric amber badge -->
    <text x="194" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="950" fill="#F59E0B" letter-spacing="0">11</text>
  </g>

  <!-- Tagline below -->
  <g transform="translate(88, 68)">
    <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#94A3B8" letter-spacing="3.5">AFRICAN &amp; GLOBAL ENTERTAINMENT</text>
  </g>
</svg>
